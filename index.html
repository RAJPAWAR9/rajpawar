<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BOOSTER V0.9 - Apple Music UI</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Password Overlay -->
  <div id="lock-screen" class="lock-overlay">
    <div class="lock-card glass-panel">
      <div class="brand-logo" style="margin: 0 auto 12px auto;"></div>
      <h2>BOOSTER V0.9</h2>
      <p style="color: var(--text-secondary); font-size: 12px; margin-top: 4px;">Dezained by raj pawar</p>
      
      <div class="lock-input-group" style="margin-top: 20px;">
        <input type="password" id="access-pass" placeholder="Enter Password">
        <button id="unlock-btn">UNLOCK</button>
      </div>
      <p id="lock-error" style="color: #ff0055; font-size: 11px; margin-top: 8px; display: none;">Invalid Password!</p>
    </div>
  </div>

  <div id="ambient-glow" class="ambient-glow"></div>

  <!-- Main Mobile Shell -->
  <div class="app-shell">
    
    <!-- Top Search Header -->
    <header class="app-header">
      <h1 class="page-title">Search</h1>
      <div class="search-bar-container">
        <input type="text" id="global-search" placeholder="Artists, Songs, Lyrics and more">
      </div>
    </header>

    <!-- Main Viewport -->
    <main class="content-viewport">
      
      <!-- HOME PAGE (Apple Category Cards) -->
      <section id="view-home" class="view-panel active">
        <div class="category-grid">
          <div class="cat-card red" onclick="filterCategory('Trending')">
            <span>Apple Music Radio</span>
          </div>
          <div class="cat-card purple" onclick="filterCategory('90s')">
            <span>Bollywood</span>
          </div>
          <div class="cat-card pink" onclick="filterCategory('3D Audio')">
            <span>Pop / 3D</span>
          </div>
          <div class="cat-card dark-red" onclick="filterCategory('All')">
            <span>All Tracks</span>
          </div>
        </div>

        <h3 class="section-title">Songs Library</h3>
        <div id="trending-grid" class="cards-grid"></div>
      </section>

      <!-- SEARCH / LIBRARY VIEW -->
      <section id="view-library" class="view-panel">
        <h3 class="section-title">Your Library</h3>
        <div id="library-list" class="cards-grid"></div>
      </section>

    </main>

    <!-- Bottom Apple Mini Player Bar -->
    <footer class="apple-mini-player" id="mini-player-bar">
      <div class="mini-art-thumb" id="mini-art">G</div>
      <div class="mini-info" id="open-full-player">
        <span id="mini-title" class="title">Select a Song</span>
        <span id="mini-artist" class="artist">BOOSTER V0.9</span>
      </div>
      <div class="mini-controls">
        <button id="mini-play-btn" class="icon-btn">▶</button>
        <button id="mini-next-btn" class="icon-btn">⏭</button>
      </div>
    </footer>

    <!-- Apple Native Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-target="view-home">
        <span class="icon">🏠</span><span>Home</span>
      </button>
      <button class="nav-item" data-target="view-library">
        <span class="icon">📑</span><span>Library</span>
      </button>
      <button class="nav-item" data-target="view-home">
        <span class="icon">🔍</span><span>Search</span>
      </button>
    </nav>

  </div>

  <!-- APPLE MUSIC FULL SCREEN OVERLAY PLAYER -->
  <div id="full-player-overlay" class="full-player">
    <div class="full-player-header">
      <button id="close-full-player" class="down-arrow">∨</button>
      <div class="header-line"></div>
      <button class="more-btn">•••</button>
    </div>

    <div class="full-art-container">
      <div id="full-cover-art" class="full-cover-art">G</div>
    </div>

    <div class="full-meta-row">
      <div class="title-meta">
        <h2 id="full-title">Gulabi Ankhen</h2>
        <p id="full-artist">Mohd. Rafi</p>
      </div>
      <button class="star-btn">☆</button>
    </div>

    <!-- Timeline Scrubber -->
    <div class="scrubber-container">
      <input type="range" id="full-progress" min="0" max="100" value="0">
      <div class="time-labels">
        <span id="full-current-time">0:00</span>
        <span id="full-total-time">-0:00</span>
      </div>
    </div>

    <!-- Playback Controls -->
    <div class="full-controls">
      <button id="full-prev-btn" class="ctrl-btn">⏮</button>
      <button id="full-play-btn" class="ctrl-btn main-play">▶</button>
      <button id="full-next-btn" class="ctrl-btn">⏭</button>
    </div>

    <!-- Footer Action Bar -->
    <div class="full-footer-bar">
      <button>💬</button>
      <button>📡</button>
      <button>≡</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
