<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player 2026</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ambient Dynamic Background Visualizer Canvas -->
  <canvas id="ambient-canvas"></canvas>

  <div class="player-container">
    
    <!-- Top Bar & Search -->
    <div class="top-bar">
      <input type="text" id="search-input" placeholder="Search songs or artists...">
      <div id="track-count" class="badge">0 Songs</div>
    </div>

    <!-- Category Buttons -->
    <div class="category-buttons">
      <button id="btn-2026" class="cat-btn active">Trending</button>
      <button id="btn-90s" class="cat-btn">90s Hits</button>
      <button id="btn-3d" class="cat-btn">3D Audio</button>
      <button id="btn-all" class="cat-btn">All Songs</button>
    </div>

    <!-- Album Art & Track Info -->
    <div class="main-display">
      <div id="album-art-box" class="album-art">
        <div id="wave-bars" class="wave-bars">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="track-info">
        <span id="category-badge" class="cat-badge">TRENDING HITS</span>
        <h2 id="song-title">Select a Song</h2>
        <p id="artist-name">Artist Name</p>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-section">
      <div id="progress-container" class="progress-container">
        <div id="progress" class="progress-bar"></div>
      </div>
      <div class="time-stamps">
        <span id="current-time">0:00</span>
        <span id="total-duration">0:00</span>
      </div>
    </div>

    <!-- Primary Player Controls -->
    <div class="controls-row">
      <button id="prev-btn" class="icon-btn">⏮</button>
      <button id="play-btn" class="icon-btn play-main">▶</button>
      <button id="next-btn" class="icon-btn">⏭</button>
    </div>

    <!-- Volume & Speed Controls -->
    <div class="extra-controls-row">
      <div class="control-group">
        <label>🔊 Volume</label>
        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">
      </div>
      <div class="control-group">
        <label>⚡ Speed: <span id="speed-val">1.0x</span></label>
        <input type="range" id="speed-slider" min="0.5" max="2" step="0.1" value="1">
      </div>
    </div>

    <!-- Special Features: Karaoke & Equalizer Buttons -->
    <div class="features-row">
      <button id="karaoke-btn" class="control-btn">🎤 Karaoke Mode: OFF</button>
      <button id="eq-toggle-btn" class="control-btn">🎛️ Equalizer</button>
      <button id="pip-btn" class="control-btn">📺 Mini Player</button>
    </div>

    <!-- Equalizer & Vocal Controls Panel -->
    <div id="eq-panel" class="eq-container hidden">
      <h3>5-Band Equalizer & Presets</h3>
      <div class="preset-selector">
        <label for="eq-presets">Preset:</label>
        <select id="eq-presets">
          <option value="flat">Flat</option>
          <option value="bass">Bass Boost</option>
          <option value="pop">Pop</option>
          <option value="rock">Rock</option>
          <option value="vocal">Vocal Booster</option>
        </select>
      </div>

      <div class="sliders-grid">
        <div><input type="range" class="eq-band-slider" data-band="0" min="-12" max="12" value="0"><span>60Hz</span></div>
        <div><input type="range" class="eq-band-slider" data-band="1" min="-12" max="12" value="0"><span>250Hz</span></div>
        <div><input type="range" class="eq-band-slider" data-band="2" min="-12" max="12" value="0"><span>1kHz</span></div>
        <div><input type="range" class="eq-band-slider" data-band="3" min="-12" max="12" value="0"><span>4kHz</span></div>
        <div><input type="range" class="eq-band-slider" data-band="4" min="-12" max="12" value="0"><span>16kHz</span></div>
      </div>
    </div>

    <!-- Lyrics Display Box -->
    <div class="lyrics-box">
      <div id="lyrics-scroll" class="lyrics-scroll"></div>
    </div>

    <!-- Playlist View -->
    <div id="playlist-view" class="playlist-container"></div>

  </div>

  <!-- Hidden Video Element for Picture-in-Picture Mini Player -->
  <video id="pip-video" autoplay muted style="display:none;"></video>

  <script src="script.js"></script>
</body>
</html>
