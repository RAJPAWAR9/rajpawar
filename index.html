<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raj Pawar | Ultimate Vibe Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: #0b131e; color: #fff; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
    
    .top-bar { width: 100%; max-width: 1200px; margin: 0 auto 20px auto; display: flex; justify-content: space-between; align-items: center; }
    .search-bar { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 10px 18px; border-radius: 20px; color: #fff; width: 280px; outline: none; }
    .crossfade-box { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 8px 16px; border-radius: 20px; font-size: 13px; }
    .crossfade-box input { cursor: pointer; accent-color: #00f2fe; }

    .main-container { display: flex; gap: 20px; width: 100%; max-width: 1200px; margin: 0 auto; flex: 1; min-height: 550px; }
    
    /* Sidebar Layout Fix */
    .sidebar { width: 340px; background: #0f1926; border-radius: 20px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; gap: 15px; }
    .categories { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px; }
    .cat-btn { background: rgba(255,255,255,0.08); border: 1px solid transparent; color: #ccc; padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; transition: 0.3s; }
    .cat-btn.active, .cat-btn:hover { background: #00f2fe; color: #000; font-weight: bold; }
    
    .playlist-scroll { flex: 1; overflow-y: auto; margin-top: 10px; padding-right: 5px; max-height: 420px; }
    .playlist-scroll::-webkit-scrollbar { width: 6px; }
    .playlist-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    
    .song-item { padding: 10px 12px; border-radius: 10px; margin-bottom: 6px; cursor: pointer; transition: 0.2s; background: rgba(255,255,255,0.02); }
    .song-item:hover { background: rgba(255,255,255,0.08); }
    .song-item.active { background: rgba(0, 242, 254, 0.15); border: 1px solid #00f2fe; }

    /* Main Player Section Fix */
    .player-section { flex: 1; background: #0f1926; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 40px; overflow: hidden; }
    #bg-glow { position: absolute; width: 350px; height: 350px; background: radial-gradient(circle, rgba(0, 242, 254, 0.25) 0%, transparent 70%); filter: blur(60px); pointer-events: none; }
    .player-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 500px; }
    
    .badge { border: 1px solid #00f2fe; color: #00f2fe; padding: 4px 14px; border-radius: 12px; font-size: 11px; margin-bottom: 20px; letter-spacing: 1px; }
    .song-title { font-size: 26px; font-weight: bold; margin-bottom: 6px; text-align: center; color: #fff; }
    .artist-name { font-size: 14px; color: #888; margin-bottom: 30px; text-align: center; }
    
    .controls { display: flex; align-items: center; gap: 20px; margin-bottom: 25px; }
    .ctrl-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: 0.2s; }
    .ctrl-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }
    .play-btn { width: 64px; height: 64px; background: #00f2fe; color: #000; font-size: 24px; font-weight: bold; box-shadow: 0 0 25px rgba(0, 242, 254, 0.4); }
    .play-btn:hover { background: #00d8e4; transform: scale(1.08); }

    /* Progress Music Line */
    .progress-bar-container { width: 100%; background: rgba(255,255,255,0.1); height: 6px; border-radius: 10px; cursor: pointer; position: relative; margin-bottom: 8px; }
    .progress-fill { width: 0%; height: 100%; background: #00f2fe; border-radius: 10px; position: relative; }
    .progress-fill::after { content: ''; position: absolute; right: -5px; top: -3px; width: 12px; height: 12px; background: #fff; border-radius: 50%; opacity: 0; transition: 0.2s; }
    .progress-bar-container:hover .progress-fill::after { opacity: 1; }
    
    .time-info { display: flex; justify-content: space-between; width: 100%; font-size: 12px; color: #777; margin-bottom: 20px; }
    
    .volume-box { display: flex; align-items: center; gap: 10px; color: #888; font-size: 14px; }
    .volume-box input { accent-color: #00f2fe; cursor: pointer; }

    footer { text-align: center; margin-top: 20px; font-size: 13px; color: #555; }
  </style>
</head>
<body>

  <div class="top-bar">
    <input type="text" id="search-input" class="search-bar" placeholder="🔍 Search songs...">
    <div class="crossfade-box">
      <span>Crossfade: <strong id="crossfade-val" style="color:#00f2fe;">10s</strong></span>
      <input type="range" id="crossfade-slider" min="0" max="10" value="10">
    </div>
  </div>

  <div class="main-container">
    <div class="sidebar">
      <h3>Categories</h3>
      <div class="categories">
        <button class="cat-btn active" id="btn-2026">2026 Music</button>
        <button class="cat-btn" id="btn-90s">90s</button>
        <button class="cat-btn" id="btn-3d">3D Audio</button>
        <button class="cat-btn" id="btn-all">All</button>
      </div>
      
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
        <h3 style="font-size: 16px;">Playlist</h3>
        <span id="track-count" style="font-size:12px; color:#666;">0 Songs</span>
      </div>
      
      <div class="playlist-scroll" id="playlist-view"></div>
    </div>

    <div class="player-section">
      <div id="bg-glow"></div>
      <div class="player-content">
        <div id="category-badge" class="badge">2026 HITS</div>
        <div id="song-title" class="song-title">Select a Song</div>
        <div id="artist-name" class="artist-name">Artist</div>

        <div class="controls">
          <button class="ctrl-btn" id="prev-btn">⏮</button>
          <button class="ctrl-btn play-btn" id="play-btn">▶</button>
          <button class="ctrl-btn" id="next-btn">⏭</button>
        </div>

        <!-- Music Progress Line -->
        <div class="progress-bar-container" id="progress-container">
          <div class="progress-fill" id="progress"></div>
        </div>
        <div class="time-info">
          <span id="current-time">0:00</span>
          <span id="total-duration">0:00</span>
        </div>

        <div class="volume-box">
          🔊 <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">
        </div>
      </div>
    </div>
  </div>

  <footer>Vibe Design by <strong style="color: #6f00ff;">RAJ PAWAR</strong></footer>

  <script src="script.js"></script>
</body>
</html>
