<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raj Pawar | Ultimate Vibe Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating Particles Background Canvas -->
  <canvas id="particleCanvas"></canvas>

  <div class="app-container">
    
    <!-- Top Controls: Crossfade & Search -->
    <header class="top-bar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Search songs..." onkeyup="filterSongs()">
      </div>
      
      <div class="crossfade-widget">
        <label for="crossfadeSlider">Crossfade: <span id="crossfadeVal">3</span>s</label>
        <input type="range" id="crossfadeSlider" min="0" max="10" value="3" step="1">
      </div>
    </header>

    <!-- Main Player Area -->
    <main class="player-main">
      
      <!-- Playlist Sidebar & Categories -->
      <aside class="sidebar">
        <h3>Categories</h3>
        <div class="category-buttons">
          <button class="cat-btn active" onclick="filterCategory('All')">All</button>
          <button class="cat-btn" onclick="filterCategory('2026 Music')">2026 Music</button>
          <button class="cat-btn" onclick="filterCategory('90s')">90s</button>
          <button class="cat-btn" onclick="filterCategory('3D')">3D Audio</button>
        </div>

        <h3>Playlist</h3>
        <ul id="playlist" class="playlist-list">
          <!-- Dynamically loaded via JavaScript -->
        </ul>
      </aside>

      <!-- Player Center Section -->
      <section class="player-card">
        <!-- Audio Visualizer Canvas -->
        <canvas id="visualizerCanvas"></canvas>

        <h2 id="songTitle">Select a Song</h2>
        <p id="songCategory" class="song-cat-tag">Category: -</p>

        <!-- Player Main Controls -->
        <div class="controls">
          <button onclick="playPrevSong()" class="ctrl-btn">⏮️</button>
          <button onclick="togglePlayPause()" id="playBtn" class="ctrl-btn main-play">▶️</button>
          <button onclick="playNextSong()" class="ctrl-btn">⏭️</button>
        </div>

        <!-- Volume Controls -->
        <div class="volume-container">
          <button id="muteBtn" onclick="toggleMute()">🔊</button>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)">
        </div>
      </section>

    </main>

    <!-- Footer Branding -->
    <footer class="footer-branding">
      <p>Vibe Design by <span class="glowing-name">Raj Pawar</span></p>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
